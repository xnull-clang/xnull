<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --line:#2a3450;

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px 32px 60px}
  header{margin-bottom:22px}
  h1{font-size:22px;font-weight:700}
  .meta{color:var(--sub);font-size:13px;margin-top:6px}
  .legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
  .legend span{font-size:12px;padding:4px 10px;border-radius:20px}
  .l-done{background:var(--done-bg);color:var(--done)}
  .l-doing{background:var(--doing-bg);color:var(--doing)}
  .l-todo{background:var(--todo-bg);color:var(--todo)}
  .stats{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--sub)}
  .stat b{color:var(--txt);font-size:15px;margin-right:6px}
  .map{margin-top:8px}
  .node{margin:6px 0 6px 22px;position:relative;padding-left:20px}
  .node::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
  .node::after{content:"";position:absolute;left:0;top:17px;width:14px;border-top:1px solid var(--line)}
  .row{display:flex;align-items:flex-start;gap:8px;cursor:default}
  .row.parent{cursor:pointer}
  .caret{flex:none;width:16px;height:16px;margin-top:5px;border-radius:4px;background:var(--panel2);color:var(--sub);
    display:flex;align-items:center;justify-content:center;font-size:10px;transition:transform .15s}
  .caret.collapsed{transform:rotate(-90deg)}
  .caret.leaf{visibility:hidden}
  .label{padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .row.root .label{background:linear-gradient(135deg,#2b4c8c,#1e355f);border-color:#3d6ab8;font-size:15px;font-weight:700;padding:7px 14px}
  .row:hover .label{border-color:var(--accent)}
  .desc{color:var(--sub);font-size:12px;line-height:1.55;margin-top:3px;max-width:640px}
  .tag{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-top:6px}
  .t-done{background:var(--done-bg);color:var(--done)}
  .t-doing{background:var(--doing-bg);color:var(--doing)}
  .t-todo{background:var(--todo-bg);color:var(--todo)}
  .t-lock{background:rgba(148,163,184,.15);color:#9fb0c9}
  .children.collapsed{display:none}
  .toolbar{margin-top:10px}
  .toolbar button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:5px 14px;font-size:12px;cursor:pointer;margin-right:8px}
  .toolbar button:hover{border-color:var(--accent)}
</style>
</head>

  </div>
  <div class="toolbar">
    <button onclick="setAll(false)">全部展开</button>
    <button onclick="setAll(true)">全部收起</button>
  </div>
</header>

const TAG = {done:["✅ 可用","t-done"],doing:["🟡 部分可用","t-doing"],todo:["❌ 缺失","t-todo"],noplanned:["🔒 设计不做","t-lock"]};
let idSeq = 0;
function render(node, container){
  const has = node.c && node.c.length;
  const id = "n" + (++idSeq);
  const [txt, cls] = TAG[node.s] || TAG.todo;
  const wrap = document.createElement("div");
  wrap.className = "node";
  wrap.innerHTML =
    `<div class="row ${node.root?'root':''} ${has?'parent':''}" ${has?`data-t="${id}"`:''}>`+
      `<span class="caret ${has?'':'leaf'}" ${has?`id="c${id}"`:''}>▼</span>`+
      `<span class="tag ${cls}">${txt}</span>`+
      `<div><div class="label">${node.t}</div>`+
      (node.d?`<div class="desc">${node.d}</div>`:"")+
      `</div></div><div class="children" ${has?`id="${id}"`:''}></div>`;
  container.appendChild(wrap);
  if(has){
    const kids = wrap.querySelector(".children");
    node.c.forEach(ch => render(ch, kids));
    wrap.querySelector(".row").addEventListener("click", () => toggle(id));
  }
}
function toggle(id, force){
  const kids = document.getElementById(id);
  const caret = document.getElementById("c"+id);
  const collapse = force !== undefined ? force : !kids.classList.contains("collapsed");
  kids.classList.toggle("collapsed", collapse);
  caret.classList.toggle("collapsed", collapse);
}
function setAll(collapse){
  document.querySelectorAll(".children").forEach(k => k.classList.toggle("collapsed", collapse));
  document.querySelectorAll(".caret:not(.leaf)").forEach(c => c.classList.toggle("collapsed", collapse));
}
render(DATA, document.getElementById("map"));
