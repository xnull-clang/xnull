<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Mini 0.3.0 · 200M runtime performance curve</title>
<desc id="desc">Runtime in seconds for 25M, 50M, 100M, and 200M LCG iterations, mini 0.3.0 versus legacy.</desc>
<defs>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; fill: #475569; }
    .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 650; fill: #1e293b; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #64748b; }
    .xlabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .value-mini { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; }
    .value-legacy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #c2410c; }
    .mini { stroke: #2563eb; stroke-width: 3; fill: none; }
    .legacy { stroke: #ea580c; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
    .dot-mini { fill: #2563eb; }
    .dot-legacy { fill: #ea580c; }
    .badge { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
  </style>
</defs>
<rect class="bg" x="0" y="0" width="1400" height="820"/>
<text class="title" x="60" y="58">Mini 0.3.0 · 200M runtime performance</text>
<text class="subtitle" x="60" y="86">LCG arithmetic loop · best of 3 after warm-up · macOS · cc -O2</text>
<rect class="badge" x="1080" y="32" width="250" height="44" rx="22"/>
<text class="badge-text" x="1205" y="61" text-anchor="middle">200M · 0.727s vs 0.726s</text>

<rect class="panel" x="60" y="135" width="1280" height="500" rx="14"/>
<text class="panel-title" x="84" y="169">Runtime by iteration count</text>
<text class="small" x="84" y="189">solid = mini 0.3.0 · dashed = legacy · ratio 1.001x at 200M</text>
  <line class="grid" x1="140" y1="590.0" x2="1310" y2="590.0"/>
  <text class="tick" x="126" y="594.0" text-anchor="end">0.0s</text>
  <line class="grid" x1="140" y1="490.0" x2="1310" y2="490.0"/>
  <text class="tick" x="126" y="494.0" text-anchor="end">0.2s</text>
  <line class="grid" x1="140" y1="390.0" x2="1310" y2="390.0"/>
  <text class="tick" x="126" y="394.0" text-anchor="end">0.4s</text>
  <line class="grid" x1="140" y1="290.0" x2="1310" y2="290.0"/>
  <text class="tick" x="126" y="294.0" text-anchor="end">0.6s</text>
  <line class="grid" x1="140" y1="190.0" x2="1310" y2="190.0"/>
  <text class="tick" x="126" y="194.0" text-anchor="end">0.8s</text>
  <line x1="140" y1="590" x2="1310" y2="590" stroke="#cbd5e1" stroke-width="1"/>
  <polyline class="mini" points="200,541.5 500,496.0 800,404.0 1100,226.5"/>
  <polyline class="legacy" points="200,541.0 500,494.0 800,405.0 1100,227.0"/>
  <text class="xlabel" x="200" y="616" text-anchor="middle">25M</text>
  <circle class="dot-mini" cx="200" cy="541.5" r="6"/>
  <circle class="dot-legacy" cx="200" cy="541.0" r="5"/>
  <text class="xlabel" x="500" y="616" text-anchor="middle">50M</text>
  <circle class="dot-mini" cx="500" cy="496.0" r="6"/>
  <circle class="dot-legacy" cx="500" cy="494.0" r="5"/>
  <text class="xlabel" x="800" y="616" text-anchor="middle">100M</text>
  <circle class="dot-mini" cx="800" cy="404.0" r="6"/>
  <circle class="dot-legacy" cx="800" cy="405.0" r="5"/>
  <text class="xlabel" x="1100" y="616" text-anchor="middle">200M</text>
  <circle class="dot-mini" cx="1100" cy="226.5" r="6"/>
  <circle class="dot-legacy" cx="1100" cy="227.0" r="5"/>
  <text class="value-mini" x="200" y="527.5" text-anchor="middle">0.097</text>
  <text class="value-legacy" x="200" y="565.0" text-anchor="middle">0.098</text>
  <text class="value-mini" x="500" y="482.0" text-anchor="middle">0.188</text>
  <text class="value-legacy" x="500" y="518.0" text-anchor="middle">0.192</text>
  <text class="value-mini" x="800" y="390.0" text-anchor="middle">0.372</text>
  <text class="value-legacy" x="800" y="429.0" text-anchor="middle">0.370</text>
  <text class="value-mini" x="1100" y="212.5" text-anchor="middle">0.727</text>
  <text class="value-legacy" x="1100" y="251.0" text-anchor="middle">0.726</text>
</svg>
