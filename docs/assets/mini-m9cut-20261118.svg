<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Mini 0.2.0 / M9-CUT milestone</title>
<desc id="desc">Readiness curve and C emission performance curve for the Mini 0.2.0 milestone.</desc>
<defs>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#2563eb" stop-opacity="0.02"/>
  </linearGradient>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; fill: #475569; }
    .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; font-weight: 650; fill: #1e293b; }
    .axis { stroke: #cbd5e1; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #64748b; }
    .xlabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #334155; }
    .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 650; fill: #1d4ed8; }
    .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
    .badge { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #166534; }
    .pass { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .mini { stroke: #2563eb; stroke-width: 3; fill: none; }
    .legacy { stroke: #ea580c; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
  </style>
</defs>
<rect class="bg" x="0" y="0" width="1500" height="850"/>
<text class="title" x="60" y="58">Mini 0.2.0 · M9-CUT milestone</text>
<text class="subtitle" x="60" y="85">2026-11-18 02:01 · record 2611180201 · first complete language → compiler → executable loop</text>
<rect class="badge" x="1228" y="34" width="210" height="42" rx="21"/>
<text class="badge-text" x="1333" y="61" text-anchor="middle">PASS · 100 / 100</text>

<rect class="panel" x="60" y="150" width="650" height="500" rx="14"/>
