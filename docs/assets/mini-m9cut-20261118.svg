<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Mini 0.2.0 · 200M runtime performance curve</title>
<desc id="desc">Runtime in seconds for 25M, 50M, 100M, and 200M iterations using the same LCG loop, comparing mini and legacy.</desc>
<defs>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; fill: #475569; }
    .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 650; fill: #1e293b; }
    .axis { stroke: #cbd5e1; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #64748b; }
    .xlabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .mini { stroke: #2563eb; stroke-width: 3; fill: none; }
    .legacy { stroke: #ea580c; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
    .badge { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
    .table { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .thead { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #475569; }
  </style>
</defs>
<rect class="bg" x="0" y="0" width="1400" height="820"/>
<text class="title" x="60" y="58">Mini 0.2.0 · 200M runtime performance</text>
<text class="subtitle" x="60" y="86">LCG arithmetic loop · median of 5 warm runs · macOS · cc -O2 · record 2611180201</text>
<rect class="badge" x="1090" y="32" width="240" height="44" rx="22"/>
<text class="badge-text" x="1210" y="61" text-anchor="middle">200M · 0.733s vs 0.732s</text>

<rect class="panel" x="60" y="135" width="1280" height="500" rx="14"/>
<text class="panel-title" x="84" y="169">Runtime by iteration count</text>
<text class="small" x="84" y="189">same generated workload; both binaries 96120 bytes</text>
<line class="grid" x1="140" y1="590.0" x2="1310" y2="590.0"/>
<text class="tick" x="126" y="594.0" text-anchor="end">0.0s</text>
<line class="grid" x1="140" y1="492.5" x2="1310" y2="492.5"/>
<text class="tick" x="126" y="496.5" text-anchor="end">0.2s</text>
<line class="grid" x1="140" y1="395.0" x2="1310" y2="395.0"/>
<text class="tick" x="126" y="399.0" text-anchor="end">0.4s</text>
<line class="grid" x1="140" y1="297.5" x2="1310" y2="297.5"/>
<text class="tick" x="126" y="301.5" text-anchor="end">0.6s</text>
<line class="grid" x1="140" y1="200.0" x2="1310" y2="200.0"/>
<text class="tick" x="126" y="204.0" text-anchor="end">0.8s</text>
<line class="axis" x1="140" y1="200" x2="140" y2="590"/>
<line class="axis" x1="140" y1="590" x2="1310" y2="590"/>
<line class="grid" x1="140.0" y1="200" x2="140.0" y2="590"/>
<text class="xlabel" x="140.0" y="617" text-anchor="middle">0M</text>
<line class="grid" x1="307.1" y1="200" x2="307.1" y2="590"/>
<text class="xlabel" x="307.1" y="617" text-anchor="middle">0M</text>
<line class="grid" x1="641.4" y1="200" x2="641.4" y2="590"/>
<text class="xlabel" x="641.4" y="617" text-anchor="middle">0M</text>
<line class="grid" x1="1310.0" y1="200" x2="1310.0" y2="590"/>
<text class="xlabel" x="1310.0" y="617" text-anchor="middle">0M</text>
<polyline class="mini" points="140.0,543.2 307.1,498.7 641.4,410.4 1310.0,232.9"/>
<polyline class="legacy" points="140.0,543.2 307.1,497.4 641.4,410.5 1310.0,233.2"/>
<circle cx="140.0" cy="543.2" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="140.0" cy="543.2" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<circle cx="307.1" cy="498.7" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="307.1" cy="497.4" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<circle cx="641.4" cy="410.4" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="641.4" cy="410.5" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<circle cx="1310.0" cy="232.9" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="1310.0" cy="233.2" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<text class="value" x="1296.0" y="214.9" text-anchor="end" fill="#1d4ed8">mini 0.733s</text>
<text class="value" x="1296.0" y="263.2" text-anchor="end" fill="#b45309">legacy 0.732s</text>
<line class="mini" x1="160" y1="216" x2="194" y2="216"/>
<text class="small" x="202" y="220">mini</text>
<line class="legacy" x1="275" y1="216" x2="309" y2="216"/>
<text class="small" x="317" y="220">legacy</text>
<text class="small" x="84" y="615">At 200M: mini/legacy ratio = 1.001x; both outputs identical (236899843).</text>
<rect class="panel" x="60" y="660" width="1280" height="85" rx="14"/>
<text class="thead" x="84" y="691">iterations</text>
<text class="thead" x="310" y="691">mini (s)</text>
<text class="thead" x="560" y="691">legacy (s)</text>
<text class="thead" x="840" y="691">mini / legacy</text>
<text class="thead" x="1090" y="691">binary size</text>
<text class="table" x="84" y="718">0M: 0.096 / 0.096   ·   0M: 0.187 / 0.190   ·   0M: 0.368 / 0.368   ·   0M: 0.733 / 0.732</text>
<text class="table" x="84" y="739">ratio 200M = 1.001x   ·   both binaries 96,120 bytes   ·   output 236899843</text>
<text class="small" x="60" y="795">This is a microbenchmark, not a general performance promise. Command: mini/legacy build of the same LCG loop with cc -O2; first run discarded, median of five warm runs.</text>
</svg>
