<line class="grid" x1="60" y1="690" x2="1440" y2="690"/>
<text class="metric" x="60" y="718">M9-PAR 47/47 diff=0   ·   26/26 regressions   ·   selfhost fixed point PASS   ·   default mini   ·   legacy retained as oracle</text>
<text class="small" x="60" y="744">Benchmark: macOS, cc -O2; compile times are wall-clock medians. Runtime loop 20,000,000 iterations: mini 0.0196s / legacy 0.0195s after warm-up.</text>
<text class="small" x="60" y="768">The readiness curve is an internal milestone index, not an external benchmark ranking. Full T0 XDK and Resource/Context remain outside this milestone.</text>
