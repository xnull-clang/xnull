<text class="tick" x="681" y="243.5" text-anchor="end" fill="#b91c1c">pass 90%</text>
<polygon points="125,570 145.0,534.5 210.0,499.0 275.0,463.5 340.0,428.0 405.0,392.5 470.0,357.0 535.0,321.5 600.0,286.0 665.0,215.0 685,570" fill="url(#area)"/>
